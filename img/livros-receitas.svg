<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#fcf6ec" rx="12"/>
  <!-- Pilha de 3 livros de culinária e receitas -->
  <!-- Livro 1 (base, grosso, vermelho escuro) -->
  <rect x="110" y="210" width="180" height="35" rx="4" fill="#a23b3b" stroke="#6b1d1d" stroke-width="2.5"/>
  <rect x="125" y="215" width="155" height="25" fill="#f8f9fa"/>
  <rect x="110" y="210" width="22" height="35" fill="#872c2c"/>
  <line x1="120" y1="210" x2="120" y2="245" stroke="#f4a261" stroke-width="2"/>
  <!-- Livro 2 (meio, verde-oliva) -->
  <rect x="125" y="170" width="160" height="32" rx="4" fill="#406343" stroke="#253d27" stroke-width="2.5"/>
  <rect x="140" y="174" width="135" height="24" fill="#fdfbf7"/>
  <rect x="125" y="170" width="20" height="32" fill="#325235"/>
  <line x1="133" y1="170" x2="133" y2="202" stroke="#e9c46a" stroke-width="2"/>
  <!-- Livro 3 (topo, aberto ou inclinado com desenho de colher/garfo) -->
  <rect x="135" y="130" width="140" height="30" rx="4" fill="#d97736" stroke="#9c4d15" stroke-width="2.5"/>
  <rect x="150" y="134" width="115" height="22" fill="#fff"/>
  <rect x="135" y="130" width="18" height="30" fill="#b85c1f"/>
  <!-- Fita marcadora de página -->
  <path d="M220 130 L220 168 L227 160 L234 168 L234 130 Z" fill="#e63946"/>
  <!-- Garfo e colher cruzados no topo -->
  <g transform="translate(195, 80) scale(0.7)">
    <path d="M0 0 L15 25 M15 0 L0 25" stroke="#7f5539" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#7f5539"/>
    <circle cx="15" cy="0" r="5" fill="#7f5539"/>
  </g>
  <text x="200" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8d5b4c">Coleção de Livros de Receitas</text>
</svg>

