<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f5ede6" rx="12"/>
  <!-- Cobertor fofinho dobrado -->
  <!-- Dobra 1 (inferior) -->
  <rect x="100" y="180" width="200" height="45" rx="18" fill="#bc6c25" stroke="#7f4f24" stroke-width="3"/>
  <!-- Dobra 2 (intermediária) -->
  <rect x="110" y="145" width="180" height="42" rx="16" fill="#dda15e" stroke="#7f4f24" stroke-width="3"/>
  <!-- Dobra 3 (topo) -->
  <rect x="120" y="110" width="160" height="40" rx="15" fill="#fefae0" stroke="#7f4f24" stroke-width="3"/>
  <!-- Fita de laço organizadora em volta do cobertor dobrado -->
  <rect x="190" y="105" width="20" height="125" rx="4" fill="#283618" stroke="#1b4332" stroke-width="2"/>
  <!-- Laço central -->
  <circle cx="200" cy="105" r="9" fill="#606c38"/>
  <ellipse cx="185" cy="102" rx="12" ry="7" fill="#606c38"/>
  <ellipse cx="215" cy="102" rx="12" ry="7" fill="#606c38"/>
  <!-- Textura / pontos de xadrez ou costura macia -->
  <line x1="135" y1="130" x2="265" y2="130" stroke="#dda15e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="125" y1="165" x2="275" y2="165" stroke="#bc6c25" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="115" y1="202" x2="285" y2="202" stroke="#936639" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="200" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8d5b4c">Cobertor Casal Macio</text>
</svg>

